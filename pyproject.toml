[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "destruction"
version = "0.1.2"
description = "A Python package with an intentionally massive dependency footprint according to chat gpt"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
# --- core ---
"numpy","scipy","pandas","sympy","numba","xarray","statsmodels","pytz","tzdata",

# --- plotting ---
"matplotlib","seaborn","plotly","bokeh","altair","holoviews","panel","datashader",

# --- ML / data ---
"scikit-learn","lightgbm","xgboost","catboost","imbalanced-learn","shap",
"optuna","mlflow","dask","dask-ml","joblib",

# --- deep learning ---
"torch","torchvision","torchaudio",
"tensorflow","keras",
"jax","jaxlib","flax","optax",

# --- NLP ---
"spacy","nltk","gensim","sentence-transformers","transformers","tokenizers",
"datasets","evaluate","sacremoses",

# --- CV ---
"opencv-python","scikit-image","imageio","pillow","albumentations","timm",

# --- web ---
"requests","httpx","urllib3","aiohttp","fastapi","flask","django",
"starlette","uvicorn","gunicorn","waitress","connexion",

# --- async ---
"anyio","trio","async-timeout","greenlet","gevent","uvloop",

# --- parsing / formats ---
"pyyaml","toml","tomli","jsonschema","lxml","beautifulsoup4","html5lib",
"xmltodict","orjson","ujson","msgpack","cattrs",

# --- databases ---
"sqlalchemy","psycopg2-binary","pymysql","pymongo","redis","tinydb",
"duckdb","influxdb-client","cassandra-driver","neo4j",

# --- crypto / security ---
"cryptography","bcrypt","passlib","pyjwt","argon2-cffi","pynacl",

# --- CLI / UX ---
"rich","typer","click","prompt-toolkit","tqdm","colorama","blessed",

# --- testing ---
"pytest","pytest-cov","pytest-asyncio","hypothesis","coverage",
"tox","nox","responses","freezegun",

# --- formatting / lint ---
"black","isort","ruff","mypy","pylint","flake8","autopep8",

# --- notebooks ---
"jupyter","ipython","ipykernel","notebook","jupyterlab",
"nbconvert","nbformat","voila",

# --- files / IO ---
"fsspec","smart-open","watchdog","pathspec","platformdirs",

# --- dates / time ---
"python-dateutil","arrow","pendulum","dateparser",

# --- config / utils ---
"attrs","pydantic","dataclasses-json","cachetools","tenacity",
"loguru","python-dotenv","packaging","importlib-metadata",

# --- cloud / misc ---
"boto3","botocore","s3transfer",
"google-cloud-storage","google-auth",
"azure-storage-blob","azure-identity",

# --- visualization extras ---
"graphviz","pygraphviz","networkx","python-louvain","pydot",

# --- audio ---
"librosa","soundfile","pydub","torchaudio","audioread",

# --- geospatial ---
"shapely","geopandas","pyproj","rasterio","fiona","folium",

# --- math / science ---
"control","pint","uncertainties","ase","rdkit-pypi","coolprop",

# --- web scraping ---
"scrapy","selenium","playwright","requests-html","fake-useragent",

# --- messaging ---
"kafka-python","pika","kombu","celery","rq",

# --- monitoring ---
"prometheus-client","opentelemetry-api","opentelemetry-sdk",

# --- random extras to reach 300 ---
"humanize","boltons","more-itertools","toolz","zipp",
"regex","rapidfuzz","python-slugify","shortuuid","ulid-py",
"bcrypt","argon2-cffi-bindings","pyopenssl","certifi","idna",
"charset-normalizer","six","wrapt","typing-extensions"
]
