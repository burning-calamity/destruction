[build-system]
requires = ["setuptools>=77", "wheel", "build"]
build-backend = "setuptools.build_meta"


[project]
name = "catastrophe"
version = "0.1.15"
description = "A sandbox-style cryptography and cipher toolkit (classical ciphers, analysis, transliteration)."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

authors = [
  { name = "burning-calamity" }
]

keywords = ["cipher", "cryptography", "encryption", "sandbox", "classical-ciphers"]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

# ⚠️ Runtime dependencies ONLY
dependencies = []

[project.optional-dependencies]
# Optional helpers only
sandbox = ["rich"]
analysis = ["regex", "rapidfuzz"]

[tool.setuptools.packages.find]
where = ["."]
include = ["catastrophe*"]

[project.scripts]
catastrophe = "catastrophe.__main__:main"
catastrophe-test = "catastrophe.tester:tester"
catastrophe-update = "catastrophe.updater:update"
catastrophe-uninstall = "catastrophe.uninstaller:uninstall_hint"
